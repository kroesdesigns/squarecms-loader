# Deploy = push to main. Every push builds the minified loader and publishes it two ways:
#
#   1. the `release` branch  — legacy sites on the one-line tag
#        https://cdn.jsdelivr.net/gh/OWNER/REPO@release/os-cms-loader.min.js
#      keep updating automatically (jsDelivr cache purged below, ~1–2 min)
#
#   2. an immutable tag v<version> (from package.json) on that same built commit —
#        https://cdn.jsdelivr.net/gh/OWNER/REPO@v2.0.0/os-cms-loader.min.js
#      SquareCMS's "instant load" inlines THIS into a site's header, so a site only
#      changes when someone presses Update in Tools, and jsDelivr caches it forever.
#      Bump "version" in package.json (and INSTANT_LOADER_VERSION in the extension's
#      lib/core.js) when you want sites to be offered the new build. A tag that already
#      exists is left alone, so re-pushing without a bump never moves a pinned site.
name: release
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: Stamp the build
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUILD="${VERSION}+${GITHUB_SHA::7}-$(date -u +%Y%m%d)"
          sed -i "s/__BUILD__/${BUILD}/g" os-cms-loader.js
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: npm run check && npm run build
      - name: Guard — the inline install must never contain a closing script tag
        run: |
          if grep -qi '</script' os-cms-loader.min.js os-cms-loader.js; then
            echo "::error::os-cms-loader contains '</script' — it would end the inline <script> in a header install"; exit 1
          fi
      - name: Publish to the release branch
        run: |
          git config user.name "squarecms-release"
          git config user.email "release@users.noreply.github.com"
          mkdir -p /tmp/rel && cp os-cms-loader.js os-cms-loader.min.js /tmp/rel/
          git checkout -B release
          git rm -rfq . || true
          cp /tmp/rel/* .
          echo "${BUILD}" > VERSION
          git add -A
          git commit -m "release ${BUILD}" || echo "nothing to commit"
          git push -f origin release
      - name: Tag this build as v${{ env.VERSION }} (only if the tag is new)
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists — leaving pinned sites untouched"
          else
            git tag -a "v${VERSION}" -m "squarecms-loader v${VERSION} (${BUILD})"
            git push origin "v${VERSION}"
          fi
      - name: Purge the jsDelivr cache
        run: |
          sleep 10
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/os-cms-loader.min.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/os-cms-loader.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@v${VERSION}/os-cms-loader.min.js" || true
